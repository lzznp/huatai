<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>画台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- 左栏：工程 -->
    <aside class="side">
      <div class="side-head">工程</div>
      <div class="new">
        <input id="newName" placeholder="新建工程，取个名字" maxlength="60" />
        <button id="btnNew">新建</button>
      </div>
      <ul id="projects" class="plist"></ul>
      <div class="side-foot"><span id="kernelBadge" class="badge">内核：检查中…</span></div>
    </aside>

    <!-- 主区：一页到底，不再分"工程页 / 单页" -->
    <main class="main">
      <div class="main-head">
        <span id="crumb">未选择工程</span>
        <span id="meta" class="note"></span>
        <button id="btnFeed">＋ 投料（选一张图）</button>
      </div>

      <div id="errBar" class="err hidden"></div>

      <!-- 单（物料）横条：点一下切换；不用点也能看到最近一单的对话 -->
      <div id="orders" class="chips hidden"></div>

      <!-- ★ 出图预览：版本条（全部版本可选、可挑两版并排）+ 九宫格标签 + 放大窗口 -->
      <div id="preview" class="preview hidden">
        <div class="pv-head">
          <span id="pvTitle" class="pv-title">预览</span>
          <span id="pvMeta" class="note"></span>
          <span class="pv-tools">
            <button id="btnView" type="button" class="mini" title="单张放大看（滚轮缩放、拖动平移、空格切九宫格、Esc 关闭）">放大</button>
            <button id="btnGrid" type="button" class="mini" title="在图上线出 9 格并标号（0 左上 … 8 右下）——你说“第 4 格”，小助手看的是同一格；这一版账里没记格号时只画格不标号">格号</button>
            <button id="btnOne" type="button" class="mini" title="只显示最新一版">单张</button>
          </span>
        </div>
        <div id="pvBar" class="pv-bar"></div>
        <div id="pvPanes" class="pv-panes"></div>
      </div>

      <!-- 对话区 -->
      <div id="chat" class="chat"></div>

      <!-- ★ 输入框常驻底部，任何时候都看得见 -->
      <div class="composer-wrap">
        <div id="thinking" class="thinking hidden">
          小助手在看你的图和你说的话…（首次要拉起运行时，可能要十几秒）
        </div>
        <div class="composer">
          <textarea id="say" rows="2" maxlength="2000" placeholder="正在准备…"></textarea>
          <div class="send-col">
            <button id="btnSay">发送</button>
            <div class="hint">Enter 发送<br />Shift+Enter 换行</div>
          </div>
        </div>
        <div id="sayHint" class="hint line">…</div>
      </div>
    </main>
  </div>

  <!-- 放大窗口（默认藏；点「放大」才出现） -->
  <div id="zoom" class="zoom hidden">
    <div class="zoom-bar">
      <span id="zoomTitle">放大看</span>
      <span class="zoom-tools">
        <button id="btnZoomOut" type="button" class="mini">−</button>
        <span id="zoomPct" class="note">100%</span>
        <button id="btnZoomIn" type="button" class="mini">＋</button>
        <button id="btnZoomFit" type="button" class="mini">适应</button>
        <button id="btnZoomOne" type="button" class="mini">1:1</button>
        <button id="btnZoomGrid" type="button" class="mini">格号</button>
        <button id="btnZoomPrev" type="button" class="mini">上一版</button>
        <button id="btnZoomNext" type="button" class="mini">下一版</button>
        <button id="btnZoomClose" type="button" class="mini">关闭</button>
      </span>
    </div>
    <div id="zoomStage" class="zoom-stage">
      <div id="zoomInner" class="zoom-inner">
        <img id="zoomImg" alt="放大预览" />
        <div id="zoomGrid" class="grid-layer hidden"></div>
      </div>
    </div>
    <div id="zoomCap" class="zoom-cap note"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
